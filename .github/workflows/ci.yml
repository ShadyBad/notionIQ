name: CI

# Every step in this workflow is allowed to fail the build.
# There is no `continue-on-error` and no `|| echo` swallowing exit codes:
# a green check here means the checks actually passed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC, mainly so the dependency audit catches new advisories.
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black (formatting)
        run: black --check --diff .

      - name: isort (import order)
        run: isort --check-only --diff .

      - name: Flake8 (syntax and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Modules with pre-existing type errors are listed under
      # [[tool.mypy.overrides]] in pyproject.toml. That list may only shrink,
      # so anything new has to type check.
      - name: mypy (type check)
        run: mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No API keys and no .env: the suite must pass entirely offline.
      - name: Run tests
        run: pytest tests/ -v --tb=short

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fails on medium and high severity findings. Low severity is reported
      # in the artifact but does not block.
      - name: Bandit (static analysis)
        run: bandit -r . -ll -x ./tests,./build,./dist,./.venv,./venv -f screen

      - name: Bandit full report
        if: always()
        run: bandit -r . -f json -o bandit-report.json -x ./tests,./build,./dist,./.venv,./venv || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      # Exits non-zero when any installed dependency has a known advisory.
      # --strict is deliberately omitted: it would also fail on notioniq
      # itself, which is installed from source and has no PyPI release to
      # look up. Advisories in real dependencies still fail the job.
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit --progress-spinner off

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/notioniq --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: notioniq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: docker run --rm notioniq:ci notioniq --help
